<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тариф Про — ApexTech Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(23, 31, 48, 0.85);
            --primary: #6366f1;
            --accent: #10b981;
            --purple: #a855f7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 20%, rgba(168, 85, 247, 0.15) 0%, transparent 60%);
        }
        .box {
            max-width: 580px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--purple);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.2);
            text-align: center;
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            background: rgba(168, 85, 247, 0.15);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: var(--purple);
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 1rem; }
        p { color: var(--text-sub); line-height: 1.6; margin-bottom: 2rem; }
        .price-display { font-size: 2.5rem; font-weight: 800; color: #fff; margin-bottom: 1.5rem; }
        .btn {
            display: inline-block;
            padding: 0.85rem 2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--purple) 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4); }
    </style>
</head>
<body>
    <div class="box">
        <div class="badge">● Тариф Про доступен (HTTP 200 OK)</div>
        <h1>Оформление Тарифа «Про»</h1>
        <div class="price-display">990 ₽ <span style="font-size:1rem; color:var(--text-sub);">/ месяц</span></div>
        <p>Расширенная конфигурация Reverse Proxy, поддержка Node.js/Python, сертификаты SSL и круглосуточная поддержка.</p>
        <button class="btn" onclick="alert('Заявка на тариф Про успешно отправлена!'); window.location.href='/';">Оформить подписку</button>
        <div style="margin-top:1.5rem;"><a href="/" style="color:var(--text-sub); text-decoration:none; font-size:0.9rem;">← На главную</a></div>
    </div>
</body>
</html>
