<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта — ApexTech Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(23, 31, 48, 0.85);
            --primary: #6366f1;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
        }
        .box {
            max-width: 500px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent);
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
        p { color: var(--text-sub); line-height: 1.6; margin-bottom: 2rem; text-align: center; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 0.5rem; }
        input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: var(--primary); }
        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-sub); text-decoration: none; font-size: 0.9rem; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <div style="text-align:center;"><div class="badge">● Страница Регистрации (HTTP 200 OK)</div></div>
        <h1>Создать аккаунт</h1>
        <p>Получите доступ к возможностям платформы ApexTech</p>

        <form onsubmit="alert('Аккаунт успешно создан!'); window.location.href='/'; return false;">
            <div class="form-group">
                <label>Ваше Имя</label>
                <input type="text" placeholder="Иван Иванов" required>
            </div>
            <div class="form-group">
                <label>Email адрес</label>
                <input type="email" placeholder="name@domain.com" required>
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>

        <a href="/" class="back-link">← Вернуться на главную</a>
    </div>
</body>
</html>
