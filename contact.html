<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты и Поддержка — ApexTech Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card: rgba(23, 31, 48, 0.85);
            --primary: #6366f1;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
        }
        .box {
            max-width: 580px;
            width: 100%;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 3rem;
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1.1rem;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--accent);
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.5rem; text-align: center; }
        p { color: var(--text-sub); line-height: 1.6; margin-bottom: 2rem; text-align: center; }
        .info-card {
            background: rgba(0,0,0,0.25);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1.5rem;
        }
        .info-card p { text-align: left; margin-bottom: 0.5rem; font-size: 0.95rem; }
        .btn {
            display: block;
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--primary) 0%, #4f46e5 100%);
            color: #fff;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
    </style>
</head>
<body>
    <div class="box">
        <div style="text-align:center;"><div class="badge">● Страница Контактов (HTTP 200 OK)</div></div>
        <h1>Связаться с нами</h1>
        <p>Наша команда поддержки всегда на связи</p>
        <div class="info-card">
            <p>📧 Email: <strong>support@akram.local</strong></p>
            <p>🌐 Сервер: <strong>Nginx 1.26.2 (Windows Localhost)</strong></p>
            <p>📍 IP: <strong>192.168.60.38</strong></p>
        </div>
        <a href="/" class="btn">Вернуться на главную</a>
    </div>
</body>
</html>
